# BitReinforceX runtime log rotation.
# Install:  sudo cp deploy/logrotate.conf /etc/logrotate.d/bitreinforcex
# (edit the path if the repo lives elsewhere)
/home/ubuntu/ai_trading_bot/logs/runtime.log {
    weekly
    rotate 4
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
